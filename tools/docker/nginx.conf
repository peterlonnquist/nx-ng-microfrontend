server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json;

  # The shell runs on another origin and loads remoteEntry.json + ES modules from here.
  # Note: add_header is not inherited into a location that sets its own headers, hence the repetition.
  set $cors "*";

  # Optional per-container locations, e.g. the /api proxy written by 41-api-proxy.sh.
  include /etc/nginx/snippets/*.conf;

  # Metadata that changes on every deploy – must never be cached.
  location ~* ^/(remoteEntry|federation\.manifest|importmap)\.json$ {
    add_header Access-Control-Allow-Origin $cors always;
    add_header Cache-Control "no-cache" always;
  }

  # Hashed bundles – safe to cache forever.
  location ~* \.(?:js|mjs|css|woff2?)$ {
    add_header Access-Control-Allow-Origin $cors always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # SPA fallback (used when the app runs standalone).
  location / {
    add_header Access-Control-Allow-Origin $cors always;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
