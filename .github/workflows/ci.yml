# Verify what changed: lint, test and build of every affected project, on PRs and on develop.
# Images are built and deployed only by the release pipeline, one app per release branch
# (docs/adr/0001-release-per-app.md, tools/jenkins/release.Jenkinsfile).
name: CI

on:
  push:
    branches: [develop]
  pull_request:

env:
  NX_NO_CLOUD: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: develop
      - run: npx nx affected -t lint test build
