# Every app is its own container = its own deployable unit.
#
#   docker compose up --build -d              # build and start everything
#   docker compose up --build -d mfe-ordering # redeploy ONLY cart + orders – the others keep running untouched
#   docker compose stop mfe-ordering          # simulate an outage – the shell shows fallbacks for cart and orders
#   docker compose stop layout-api            # dashboard degrades to "all widgets, default size"
#
# Remote URLs are what the *browser* uses, hence localhost + the published port.
# Override any of them to mix local dev servers with containers, e.g.:
#   MFE_ORDERING_URL=http://localhost:4203/remoteEntry.json docker compose up -d shell

x-web: &web
  build: &web-build
    context: .
    dockerfile: tools/docker/Dockerfile
    target: web
  restart: unless-stopped
  healthcheck:
    test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/health']
    interval: 10s
    timeout: 3s
    retries: 3

services:
  shell:
    <<: *web
    build: { <<: *web-build, args: { APP: shell } }
    image: mfe-store/shell:latest
    ports: ['8080:80']
    environment:
      MFE_REMOTE_MFE_INSIGHTS: ${MFE_INSIGHTS_URL:-http://localhost:8091/remoteEntry.json}
      MFE_REMOTE_MFE_PRODUCTS: ${MFE_PRODUCTS_URL:-http://localhost:8092/remoteEntry.json}
      MFE_REMOTE_MFE_ORDERING: ${MFE_ORDERING_URL:-http://localhost:8093/remoteEntry.json}
      MFE_REMOTE_MFE_PROFILE: ${MFE_PROFILE_URL:-http://localhost:8095/remoteEntry.json}
      # Server-side (container network) – the browser only ever calls same-origin /api/...
      API_UPSTREAM: http://layout-api:3333

  mfe-insights:
    <<: *web
    build: { <<: *web-build, args: { APP: mfe-insights } }
    image: mfe-store/mfe-insights:latest
    ports: ['8091:80']

  mfe-products:
    <<: *web
    build: { <<: *web-build, args: { APP: mfe-products } }
    image: mfe-store/mfe-products:latest
    ports: ['8092:80']

  # Hosts two domains (cart, orders) owned by the same team: one image, one deployment.
  mfe-ordering:
    <<: *web
    build: { <<: *web-build, args: { APP: mfe-ordering } }
    image: mfe-store/mfe-ordering:latest
    ports: ['8093:80']

  mfe-profile:
    <<: *web
    build: { <<: *web-build, args: { APP: mfe-profile } }
    image: mfe-store/mfe-profile:latest
    ports: ['8095:80']

  # Stores the dashboard layout. Not published – only reachable through the shell's /api proxy.
  layout-api:
    build:
      context: .
      dockerfile: tools/docker/Dockerfile
      target: api
      args: { APP: layout-api }
    image: mfe-store/layout-api:latest
    restart: unless-stopped
    volumes: ['layout-data:/data']
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3333/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  layout-data:
